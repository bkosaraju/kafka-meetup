# log4j2.properties (Place this in src/test/resources)

# Define the console appender
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{HH:mm:ss.SSS}] [%t] %-5level %logger{36} - %msg%n

# 1. Set the global log level for the root logger (e.g., WARN or INFO)
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = Console

# 2. Set the Flink loggers to DEBUG
# This targets core Flink components, including the MiniCluster runner
logger.flink.name = org.apache.flink
logger.flink.level = DEBUG 
logger.flink.appenderRef.console.ref = Console

# 3. Target specific low-level Flink components for verbose output
logger.runtime.name = org.apache.flink.runtime
logger.runtime.level = DEBUG
logger.runtime.appenderRef.console.ref = Console

# 4. Target your application code loggers (if you use a specific package)
# logger.app.name = com.yourcompany.app
# logger.app.level = DEBUG